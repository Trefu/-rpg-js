<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1a1a1a" />
    <meta name="description" content="RPG JS: tactical turn-based combat expeditions." />

    <link rel="preload" as="audio" href="/assets/music/menu_ost.mp3" />
    <link rel="dns-prefetch" href="/" />

    <title>RPG JS</title>

    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #1a1a1a; color: #f5f5f5; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      #app { height: 100%; }
      #splash {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 1.25rem;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        z-index: 9999; padding: 1.5rem; box-sizing: border-box;
      }
      #splash.is-hidden { display: none; }
      .splash__title { font-size: clamp(1.75rem, 5vw, 2.5rem); font-weight: 800; letter-spacing: 0.04em; margin: 0; text-align: center; }
      .splash__subtitle { margin: 0; color: rgba(255,255,255,0.65); font-size: 0.95rem; text-align: center; max-width: 32ch; }
      .splash__progress-wrap { width: min(420px, 90vw); display: flex; flex-direction: column; gap: 0.5rem; }
      .splash__progress { width: 100%; height: 8px; background: rgba(255,255,255,0.08); border-radius: 999px; overflow: hidden; }
      .splash__bar { height: 100%; width: 0%; background: linear-gradient(90deg, #4CAF50, #66bb6a); transition: width 0.25s ease; }
      .splash__status { font-size: 0.85rem; color: rgba(255,255,255,0.6); min-height: 1.2em; text-align: center; font-variant-numeric: tabular-nums; }
      .splash__btn {
        margin-top: 0.5rem; padding: 0.85rem 2rem; border: none; border-radius: 6px;
        background: #4CAF50; color: #0d1f0d; font-weight: 800; font-size: 1rem;
        cursor: pointer; letter-spacing: 0.02em; transition: background 0.15s, transform 0.1s;
        box-shadow: 0 4px 14px rgba(76, 175, 80, 0.35);
      }
      .splash__btn:hover { background: #66bb6a; transform: translateY(-1px); }
      .splash__btn:active { transform: translateY(0); }
      .splash__btn[disabled] { background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.4); cursor: not-allowed; box-shadow: none; transform: none; }
      .splash__hint { font-size: 0.75rem; color: rgba(255,255,255,0.4); margin-top: 0.25rem; text-align: center; }
      .splash__error { color: #ff8a80; font-size: 0.9rem; text-align: center; }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div id="splash" role="dialog" aria-labelledby="splash-title">
      <h1 id="splash-title" class="splash__title">RPG JS</h1>
      <p class="splash__subtitle">Preparando la aventura...</p>
      <div class="splash__progress-wrap">
        <div class="splash__progress" aria-hidden="true"><div id="splash-bar" class="splash__bar"></div></div>
        <div id="splash-status" class="splash__status">Iniciando...</div>
      </div>
      <button id="splash-btn" class="splash__btn" disabled>Comenzar</button>
      <p class="splash__hint">Toca &quot;Comenzar&quot; para iniciar la musica.</p>
    </div>

    <script>
      (function () {
        var splash = document.getElementById('splash');
        var bar = document.getElementById('splash-bar');
        var statusEl = document.getElementById('splash-status');
        var btn = document.getElementById('splash-btn');

        function setProgress(p, label) {
          bar.style.width = Math.round(p * 100) + '%';
          if (label) statusEl.textContent = label;
        }

        function loadImage(url) {
          return new Promise(function (resolve) {
            var img = new Image();
            img.decoding = 'async';
            img.onload = function () { resolve(true); };
            img.onerror = function () { resolve(false); };
            img.src = url;
          });
        }

        function fetchHead(url) {
          return fetch(url, { method: 'GET', cache: 'force-cache' })
            .then(function (r) { return r.ok; })
            .catch(function () { return false; });
        }

        function ready() {
          splash.classList.add('is-hidden');
          if (window.__startApp) window.__startApp();
        }

        window.__splash = {
          setProgress: setProgress,
          ready: ready,
          fail: function (msg) {
            statusEl.className = 'splash__status splash__error';
            statusEl.textContent = msg || 'Error al cargar los recursos. Reintenta.';
            btn.disabled = false;
            btn.textContent = 'Reintentar';
          }
        };

        window.addEventListener('error', function (e) {
          if (!splash.classList.contains('is-hidden')) {
            console.error('[splash] error', e.message);
          }
        });
      })();
    </script>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
