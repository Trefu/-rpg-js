name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancela runs en cola cuando llega un push nuevo a la misma branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Tests + Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Type-check + bundle build. Si alguno falla, el merge a main queda
      # bloqueado (a menos que el reviewer use admin override).
      - name: TypeScript type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      # Coverage: subimos el reporte como artifact. Para hacer fail el
      # build cuando el coverage baja de un threshold, configurar
      # `coverage.thresholds` en vite.config.ts.
      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
